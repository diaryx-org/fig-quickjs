[package]
name = "fig-quickjs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A fig format written in JavaScript: a helper the fig CLI spawns, and a Language the fig crate registers, over an ES module that parses and prints the format, run on QuickJS."
readme = "README.md"
documentation = "https://docs.rs/fig-quickjs"
keywords = ["fig", "javascript", "quickjs", "config", "parser"]
categories = ["config", "parser-implementations", "command-line-utilities"]
publish = true

# A workspace of one package, kept for `[workspace.package]` below. CI is not a
# crate here: it is the jobs in .config/ship.figl, run by `ship ci`.
[workspace]

# One `version = "…"` line for the whole repository, which is what `ship bump`
# rewrites and what the package inherits.
[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version, enforced by the `msrv` CI job, which reads
# this value. fig-lua's floor, which rquickjs 0.13 (1.87) is under.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/fig-quickjs"

# The helper executable: `fig-quickjs <module.mjs>` serves the module's format
# to a `fig` binary over stdin and stdout. No feature flag — a `cargo install
# fig-quickjs` is a working helper.
[[bin]]
name = "fig-quickjs"
path = "src/main.rs"

[dependencies]
# The contract this crate implements: `fig::language::Language` is what a
# module becomes, and the `helper` module's JSON shape is the shape a module
# speaks — so the JavaScript side is documented once, there, and once more
# as the `Language` type of `@diaryx/fig`, which is the same shape with the
# same names. fig is pure Rust from 7 and registers no language by default,
# so a helper carries only the one it serves; the `helper` feature is the
# wire, read and written with serde_json.
fig = { version = "7", features = ["helper"] }
# The wire's JSON: what `fig::helper`'s functions trade, and what a module's
# answers are read as.
serde_json = "1"
# QuickJS-ng, vendored: the engine is built into the binary, so a helper is
# one file with no runtime to install beside it. `loader` for the module
# resolver that serves `fig`, `fig/grammar` and `@diaryx/fig/helper` from
# the binary; `array-buffer` for the `Uint8Array` the scanner works over.
rquickjs = { version = "0.13", features = ["loader", "array-buffer"] }

# The compiled languages each twin is held to in-process: since fig 7 each is
# a crate of its own, and `fig` alone registers none. Only their `fig`
# feature, which is `register()` and `format()`; not their serde API. plist
# and canonical are held to their siblings table for table, through the
# fixtures `fig lang table -i <format>` printed, and not in-process.
[dev-dependencies]
fig-dotenv = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }
fig-ini = { version = "7", default-features = false, features = ["fig"] }
fig-json = { version = "7", default-features = false, features = ["fig"] }
fig-nestedtext = { version = "7", default-features = false, features = ["fig"] }
fig-properties = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-zon = { version = "7", default-features = false, features = ["fig"] }

[profile.release]
# A helper is spawned per `fig` invocation; its size and start-up are what
# a user feels.
lto = true
codegen-units = 1
