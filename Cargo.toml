[package]
name = "fig-quickjs"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Spike: a fig helper running a JavaScript Language under QuickJS."
publish = false

[dependencies]
rquickjs = { version = "0.13", features = ["loader", "array-buffer", "macro"] }

[profile.release]
lto = true
codegen-units = 1
